{% extends 'base.html' %}{% block title %}Create a trip — Travel Buddy Finder{% endblock %}{% block content %}<section class="page-top"><div class="container"><div class="eyebrow">MAKE IT HAPPEN</div><h1>Every great trip starts somewhere.</h1><p>Set the basics now. You and your crew can build the details together.</p></div></section><section class="section-pad pt-4"><div class="container narrow"><form method="post" class="panel-form"><div class="row g-3"><div class="col-12"><label class="form-label">Trip name</label><input class="form-control" name="title" required placeholder="e.g. Himalayan escape"></div><div class="col-md-6"><label class="form-label">Destination</label><input class="form-control" name="destination" required placeholder="e.g. Ladakh"></div><div class="col-md-6"><label class="form-label">Starting location</label><input class="form-control" name="start_location" placeholder="e.g. Delhi"></div><div class="col-md-6"><label class="form-label">Start date</label><input class="form-control" type="date" name="start_date" required></div><div class="col-md-6"><label class="form-label">End date</label><input class="form-control" type="date" name="end_date" required></div><div class="col-md-6"><label class="form-label">Estimated budget per person (₹)</label><input class="form-control" type="number" min="0" name="budget" value="15000" required></div><div class="col-md-6"><label class="form-label">Maximum group size (including you)</label><input class="form-control" type="number" min="2" max="30" name="max_members" value="4" required></div><div class="col-12"><label class="form-label">What is this trip about?</label><textarea class="form-control" name="description" rows="4" placeholder="Share the vibe, highlights, and who might enjoy this trip."></textarea></div><div class="col-12"><label class="form-label">Interests (comma-separated)</label><input class="form-control" name="interests" placeholder="Hiking, photography, food"></div></div><button class="btn btn-dark btn-lg mt-4">Create trip workspace ↗</button></form></div></section>{% endblock %}
